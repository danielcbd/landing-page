<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro | Paloma &amp; Gabriel</title>
<meta name="description" content="Roteiro de Paloma e Gabriel — viagem encerrada.">
<link rel="icon" href="../ressurgencia/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="../ressurgencia/assets/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe7d6;
    --paper-deep:#e3d4b3;
    --ink:#1d170f;
    --ink-soft:#6e6353;
    --rhein:#ff4d23;
    --rhein-deep:#a82c10;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Big Shoulders Display',sans-serif;font-weight:900;text-transform:uppercase;text-wrap:balance;}
  .card{
    max-width:420px;width:100%;background:var(--paper-deep);border:2px solid var(--ink);
    padding:36px 30px;text-align:center;
  }
  .logo-img{height:26px;width:auto;display:block;margin:0 auto 26px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.76rem;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--rhein-deep);
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    padding:6px 0;margin-bottom:20px;display:inline-block;
  }
  h1{font-size:1.9rem;line-height:1.05;margin:0 0 14px;}
  h1 .cut{color:var(--rhein);}
  p.lead{color:var(--ink-soft);font-size:0.95rem;margin:0 0 26px;}
  .wa-btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.78rem;
    letter-spacing:0.03em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);
    padding:12px 18px;border:2px solid var(--ink);text-decoration:none;
    transition:background .15s ease,color .15s ease;
  }
  .wa-btn:hover{background:var(--rhein);border-color:var(--rhein);color:var(--ink);}
</style>
</head>
<body>
<div class="card">
  <img class="logo-img" src="assets/rhein-wordmark.png" alt="Rhein Viagens">
  <span class="eyebrow">Roteiro encerrado</span>
  <h1 class="display">Essa viagem<br>já terminou<span class="cut">.</span></h1>
  <p class="lead">O roteiro de Paloma &amp; Gabriel não está mais disponível nesta página. Se precisar de algum documento da viagem, é só chamar a gente.</p>
  <a class="wa-btn" href="https://chat.whatsapp.com/BAeYdlEeFaU4vbDrHW4tl9?s=cl&p=i&mlu=0&ilr=4">Falar com a Rhein</a>
</div>
</body>
</html>
